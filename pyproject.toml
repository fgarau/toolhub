[project]
name = "toolhub"
version = "0.1.0"
description = "Evidence-backed, constraint-aware developer tool recommendations on MongoDB Atlas"
readme = "README.md"
authors = [
    { name = "Francisco Garau", email = "fgarau@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pymongo>=4.19.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
toolhub = "toolhub:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
